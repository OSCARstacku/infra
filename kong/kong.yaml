_format_version: "3.0"

services:

  - name: sdata-ms-base

    protocol: grpc

    host: sdata-ms-base

    port: 50051

    routes:

      - name: sdata-ms-base-route

        paths:
          - /api/v1/base

        strip_path: false

        protocols:
          - http
          - https

    plugins:

      - name: grpc-gateway

        config:

          proto: /etc/kong/protos/base/v1/base.proto