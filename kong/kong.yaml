_format_version: "3.0"

services:
  # Microservicio: ms-admin
  - name: ms-admin
    protocol: grpc
    host: ms-admin
    port: 50051
    routes:
      - name: ms-admin-route
        paths:
          - /api/v1/admin
        strip_path: false
        protocols:
          - http
          - https
    plugins:
      - name: grpc-gateway
        config:
          proto: /etc/kong/protos/admin/v1/admin.proto